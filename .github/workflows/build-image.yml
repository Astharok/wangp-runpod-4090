name: Build WanGP RunPod image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-image.yml"
      - "runpod-entrypoint.sh"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: astharok/wangp-runpod-4090
  WANGP_COMMIT: 22d1f26165592ed1ec07d8766b794902bf61bbf9

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out this build configuration
        uses: actions/checkout@v4

      - name: Check out the pinned official WanGP source
        uses: actions/checkout@v4
        with:
          repository: deepbeepmeep/WanGP
          ref: ${{ env.WANGP_COMMIT }}
          path: WanGP

      - name: Adapt the official image for RunPod RTX 4090
        run: |
          cp runpod-entrypoint.sh WanGP/runpod-entrypoint.sh
          printf 'torch==2.10.0+cu130\ntorchvision==0.25.0+cu130\ntorchaudio==2.10.0+cu130\n' > WanGP/pytorch-constraints.txt
          sed -i 's|nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04|nvidia/cuda:13.0.2-cudnn-devel-ubuntu24.04|' WanGP/Dockerfile
          sed -i 's/python3-pip git/python3-pip python3-venv python3-dev build-essential git/' WanGP/Dockerfile
          sed -i '/# Upgrade pip first/i RUN python3 -m venv /opt/venv\nENV PATH="/opt/venv/bin:$PATH"' WanGP/Dockerfile
          sed -i '/ENV DEBIAN_FRONTEND=noninteractive/a ENV PIP_BREAK_SYSTEM_PACKAGES=1\nENV PIP_NO_CACHE_DIR=1' WanGP/Dockerfile
          sed -i '/COPY requirements.txt ./a COPY pytorch-constraints.txt .' WanGP/Dockerfile
          sed -i 's|RUN pip install torch==2.10.0+cu128 torchvision==0.25.0+cu128 torchaudio==2.10.0+cu128 --index-url https://download.pytorch.org/whl/cu128|RUN pip install torch==2.10.0+cu130 torchvision==0.25.0+cu130 torchaudio==2.10.0+cu130 --index-url https://download.pytorch.org/whl/cu130|' WanGP/Dockerfile
          sed -i 's|RUN pip install -r requirements.txt|RUN pip install -c pytorch-constraints.txt -r requirements.txt|' WanGP/Dockerfile
          sed -i '/# Install SageAttention from git/,/pip install --no-build-isolation ./c\# Install WanGP tested wheels for Python 3.12, PyTorch 2.10 and CUDA 13\nRUN pip install --no-deps "https://github.com/deepbeepmeep/SageAttention/releases/download/v2.2.0-linux.cg1/sageattention-2.2.0%2Bcu130torch2.10.0.cg1-cp312-cp312-linux_x86_64.whl" && pip install --no-deps "https://github.com/deepbeepmeep/WGPKernels/releases/download/v1.1.2/wgpkernels-1.1.2%2Bcu130-py3-none-linux_x86_64.whl"' WanGP/Dockerfile
          sed -i 's/useradd -u 1000 -ms/useradd -u 10001 -ms/' WanGP/Dockerfile
          sed -i 's|WORKDIR /workspace|WORKDIR /opt/WanGP|' WanGP/Dockerfile
          sed -i 's|chown -R user:user /workspace|chown -R user:user /opt/WanGP|' WanGP/Dockerfile
          sed -i '/COPY entrypoint.sh/,$d' WanGP/Dockerfile
          cat >> WanGP/Dockerfile <<'EOF'

          COPY . /opt/WanGP
          COPY runpod-entrypoint.sh /usr/local/bin/runpod-entrypoint.sh
          RUN chmod +x /usr/local/bin/runpod-entrypoint.sh && chown -R user:user /opt/WanGP
          WORKDIR /opt/WanGP
          EXPOSE 7860 7866
          ENTRYPOINT ["/usr/local/bin/runpod-entrypoint.sh"]
          EOF

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the WanGP image for RTX 4090
        uses: docker/build-push-action@v6
        with:
          context: WanGP
          push: true
          build-args: |
            CUDA_ARCHITECTURES=8.9
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:testing
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.WANGP_COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
